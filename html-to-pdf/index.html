<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML / RICH TEXT KE PDF 🌐</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap"></noscript>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/webfonts/fa-solid-900.woff2">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="tool-page">
    <canvas id="backgroundCanvas"></canvas>

    <div class="card">
        <header class="card-header">
            <a href="/" class="back-button"><i class="fas fa-arrow-left"></i> KEMBALI</a>
            <h1>HTML / RICH TEXT KE PDF 🌐</h1>
            <p>Ketik atau paste kode HTML / catatan bertuliskan Rich Text lalu export sebagai PDF.</p>
        </header>
        <main class="card-body">
            <div class="step">
                <label for="htmlEditor"><i class="fas fa-code"></i> INPUT HTML / TEKS FORMATTED</label>
                <textarea id="htmlEditor" rows="10" style="width: 100%; padding: 15px; border: 3px solid #000; font-family: var(--font-mono); font-size: 13px;" placeholder="<h1>Judul Dokumen</h1><p>Tulis paragraf di sini...</p>"></textarea>
            </div>

            <div class="step">
                <label><i class="fas fa-eye"></i> LIVE PREVIEW TAMPILAN</label>
                <div id="htmlPreview" style="background: #ffffff; color: #000000; border: 3px solid #000; padding: 25px; min-height: 150px; overflow-y: auto;"></div>
            </div>

            <button id="convertBtn">
                <i class="fas fa-file-pdf"></i> EXPORT SEBAGAI PDF
            </button>

            <div class="progress-container" id="progressContainer" style="display: none;">
                <p id="status">MEMPROSES PDF...</p>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <div class="result-info" id="resultInfo" style="display: none;">
                <h2>DOKUMEN SIAP</h2>
                <div class="stats">
                    <p>STATUS: <strong>BERHASIL DIBUAT</strong></p>
                    <p>UKURAN FILE: <strong id="pdfResultSize">—</strong></p>
                </div>
                <a id="downloadLink" class="download-link"><i class="fas fa-download"></i> UNDUH FILE PDF</a>
                <button type="button" id="resetBtn" class="reset-btn" onclick="window.handleHtmlReset && window.handleHtmlReset()"><i class="fas fa-redo"></i> BUAT DOKUMEN LAIN</button>
            </div>
        </main>
    </div>

    <!-- Load scripts -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script defer src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script defer src="../js/shared/security.js"></script>
    <script defer src="../js/shared/toast.js"></script>
    <script defer src="../js/shared/pwa.js"></script>
    <script defer src="../js/shared/canvas-animation.js"></script>
    <script defer src="../js/shared/navbar.js"></script>
    <script defer src="../js/shared/tool-ui.js"></script>
    <script defer src="../js/tools/html-to-pdf.js"></script>
</body>
</html>

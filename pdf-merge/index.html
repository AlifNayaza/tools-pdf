<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content Security Policy - Mencegah XSS attacks -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <!-- Mencegah clickjacking -->
    <meta http-equiv="X-Frame-Options" content="DENY">

    <!-- Mencegah MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- XSS Protection -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">

    <!-- Referrer Policy -->
    <meta name="referrer" content="no-referrer-when-downgrade">

    <!-- Permissions Policy -->
    <meta http-equiv="Permissions-Policy" content="
        geolocation=(),
        microphone=(),
        camera=(),
        payment=(),
        usb=(),
        magnetometer=(),
        gyroscope=(),
        accelerometer=()
    ">
    <title>GABUNG PDF 📑</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap"></noscript>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/webfonts/fa-solid-900.woff2">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="tool-page">
    <canvas id="backgroundCanvas"></canvas>
    <!-- Navbar akan di-inject otomatis oleh navbar.js -->

    <div class="card">
        <header class="card-header">
            <a href="/" class="back-button"><i class="fas fa-arrow-left"></i> KEMBALI</a>
            <h1>GABUNG PDF 📑</h1>
            <p>Gabungkan beberapa file PDF menjadi satu dokumen.</p>
        </header>
        <main class="card-body">
            <div class="step" id="step1">
                <label for="pdfFiles" class="file-label" id="dropArea">
                    <i class="fas fa-file-pdf"></i>
                    <span>PILIH FILE PDF</span>
                    <small>BISA BANYAK SEKALIGUS • MAX 100MB TOTAL</small>
                </label>
                <input type="file" id="pdfFiles" accept=".pdf" multiple hidden>
            </div>
            
            <div id="fileListContainer" style="display: none;">
                <h3 style="font-family: 'Archivo Black', sans-serif; margin-bottom: 15px;">
                    <i class="fas fa-list"></i> DAFTAR PDF (DRAG UNTUK URUTAN)
                </h3>
                <div class="pdf-list" id="pdfList"></div>
                <button class="add-more-btn" id="addMoreBtn">
                    <i class="fas fa-plus"></i> TAMBAH PDF LAGI
                </button>
            </div>

            <div class="file-info" id="fileInfo" style="display: none;">
                <p><strong>NAMA FILE:</strong> <span id="fileName"></span></p>
                <p><strong>TOTAL PDF:</strong> <span id="pdfCount"></span></p>
                <p><strong>TOTAL UKURAN:</strong> <span id="totalSize"></span></p>
                <p><strong>TOTAL HALAMAN:</strong> <span id="totalPages"></span></p>
            </div>

            <button id="mergeBtn" style="display: none;">
                <i class="fas fa-object-group"></i> GABUNG SEMUA PDF
            </button>

            <div class="progress-container" id="progressContainer" style="display: none;">
                <p id="status">MENGGABUNGKAN...</p>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <div class="result-info" id="resultInfo" style="display: none;">
                <h2>PENGGABUNGAN SELESAI</h2>
                <div class="stats">
                    <p>JUMLAH PDF: <strong id="mergedCount"></strong></p>
                    <p>TOTAL HALAMAN: <strong id="mergedPages"></strong></p>
                    <p>UKURAN FILE: <strong id="mergedSize"></strong></p>
                </div>
                <a id="downloadLink" class="download-link"><i class="fas fa-download"></i> UNDUH PDF GABUNGAN</a>
                <button type="button" id="resetBtn" class="reset-btn" onclick="window.handlePdfMergeReset && window.handlePdfMergeReset()"><i class="fas fa-redo"></i> GABUNG PDF LAIN</button>
            </div>
        </main>
    </div>
    
    <!-- Load scripts -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script defer src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script defer src="../js/shared/security.js"></script>
    <script defer src="../js/shared/toast.js"></script>
    <script defer src="../js/shared/pwa.js"></script>
    <script defer src="../js/shared/canvas-animation.js"></script>
    <script defer src="../js/shared/navbar.js"></script>
    <script defer src="../js/shared/tool-ui.js"></script>
    <script defer src="../js/tools/pdf-merge.js"></script>
</body>
</html>

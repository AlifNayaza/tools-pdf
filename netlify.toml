[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer-when-downgrade"

[[redirects]]
  from = "/pdf-compressor"
  to = "/pdf-compressor/index.html"
  status = 200

[[redirects]]
  from = "/pdf-merge"
  to = "/pdf-merge/index.html"
  status = 200


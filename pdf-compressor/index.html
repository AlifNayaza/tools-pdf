<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com;
        worker-src 'self' blob: https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self' data: blob: https://cdnjs.cloudflare.com https://unpkg.com;
        base-uri 'self';
        form-action 'self';
    ">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Kompres PDF ⚡</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tool-page">
    <canvas id="backgroundCanvas"></canvas>

    <div class="card">
        <header class="card-header">
            <a href="/" class="back-button"><i class="fas fa-arrow-left"></i> Kembali</a>
            <h1>Kompres PDF ⚡</h1>
            <p>Kurangi ukuran file PDF tanpa kehilangan kualitas.</p>
        </header>
        <main class="card-body">
            <!-- Step 1: Upload -->
            <div class="step" id="step1">
                <label for="pdfFile" class="file-label" id="dropArea">
                    <div class="file-label-icon"><i class="fas fa-file-pdf"></i></div>
                    <span>Pilih File PDF</span>
                    <small>Atau drag &amp; drop di sini &bull; Maks. 100MB</small>
                </label>
                <input type="file" id="pdfFile" accept=".pdf" hidden>
            </div>

            <!-- File Info -->
            <div class="file-info" id="fileInfo" style="display:none;">
                <div class="info-row"><i class="fas fa-file"></i> <strong>Nama:</strong> <span id="fileName"></span></div>
                <div class="info-row"><i class="fas fa-weight"></i> <strong>Ukuran:</strong> <span id="fileSize"></span></div>
                <div class="info-row"><i class="fas fa-copy"></i> <strong>Halaman:</strong> <span id="filePages">...</span></div>
            </div>

            <!-- Step 2: Settings -->
            <div class="step" id="step2" style="display:none;">
                <label for="quality"><i class="fas fa-sliders-h"></i> Kualitas Kompresi</label>
                <div class="quality-slider">
                    <input type="range" id="quality" min="0.1" max="1.0" step="0.05" value="0.7">
                    <span id="qualityValue">0.70</span>
                </div>
                <div class="quality-hints">
                    <span>Kompresi Tinggi</span>
                    <span>Kualitas Tinggi</span>
                </div>
            </div>

            <!-- Compress Button -->
            <button id="compressBtn" class="action-btn" style="display:none;">
                <i class="fas fa-cogs"></i> Mulai Kompresi
            </button>

            <!-- Progress -->
            <div class="progress-container" id="progressContainer" style="display:none;">
                <p id="status" class="status-text">Mengompres...</p>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <!-- Result -->
            <div class="result-info" id="resultInfo" style="display:none;">
                <h2>KOMPRESI SELESAI</h2>
                <div class="stats">
                    <p>UKURAN ASLI: <strong id="originalSize">—</strong></p>
                    <p>UKURAN BARU: <strong id="newSize">—</strong></p>
                    <p>HEMAT: <strong id="sizeSavings">—</strong></p>
                </div>
                <a id="downloadLink" class="download-link">
                    <i class="fas fa-download"></i> UNDUH FILE
                </a>
                <button type="button" id="resetBtn" class="reset-btn" onclick="window.handlePdfCompressorReset && window.handlePdfCompressorReset()"><i class="fas fa-redo"></i> KOMPRES FILE LAIN</button>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="../js/shared/security.js"></script>
    <script src="../js/shared/toast.js"></script>
    <script src="../js/shared/pwa.js"></script>
    <script src="../js/shared/file-validator.js"></script>
    <script src="../js/shared/canvas-animation.js"></script>
    <script src="../js/shared/navbar.js"></script>
    <script src="../js/tools/pdf-compressor.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF KE GAMBAR PANJANG 📜</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="tool-page">
    <canvas id="backgroundCanvas"></canvas>

    <div class="card">
        <header class="card-header">
            <a href="/" class="back-button"><i class="fas fa-arrow-left"></i> KEMBALI</a>
            <h1>PDF KE GAMBAR PANJANG 📜</h1>
            <p>Gabungkan semua halaman PDF menjadi 1 file gambar vertikal kontinu (Infografis/Katalog).</p>
        </header>
        <main class="card-body">
            <div class="step" id="step1">
                <label for="pdfFile" class="file-label" id="dropArea">
                    <i class="fas fa-scroll"></i>
                    <span>PILIH FILE PDF</span>
                    <small>MAX 100MB</small>
                </label>
                <input type="file" id="pdfFile" accept=".pdf" hidden>
            </div>

            <div class="file-info" id="fileInfo" style="display: none;">
                <p><strong>NAMA FILE:</strong> <span id="fileName"></span></p>
                <p><strong>HALAMAN:</strong> <span id="filePages"></span></p>
            </div>

            <div class="step" id="step2" style="display: none;">
                <label for="imageFormat"><i class="fas fa-image"></i> FORMAT GAMBAR OUTPUT</label>
                <select id="imageFormat" style="margin-bottom: 15px;">
                    <option value="png">PNG (Resolusi Tinggi)</option>
                    <option value="jpeg">JPEG (Ukuran File Optimal)</option>
                </select>
            </div>

            <button id="convertBtn" style="display: none;">
                <i class="fas fa-scroll"></i> GABUNG JADI GAMBAR PANJANG
            </button>

            <div class="progress-container" id="progressContainer" style="display: none;">
                <p id="status">MEMPROSES GABUNGAN GAMBAR...</p>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <div class="result-info" id="resultInfo" style="display: none;">
                <h2>PENGGABUNGAN SELESAI</h2>
                <div class="stats">
                    <p>DIMENSI GAMBAR: <strong id="longImageDimensions">—</strong></p>
                    <p>UKURAN FILE: <strong id="longImageSize">—</strong></p>
                </div>
                <div style="margin: 20px 0; text-align: center; max-height: 400px; overflow-y: auto; border: 3px solid #000; padding: 10px;">
                    <img id="resultLongImage" alt="Preview Gambar Panjang" style="max-width: 100%; height: auto; border: 2px solid #000;">
                </div>
                <a id="downloadLink" class="download-link"><i class="fas fa-download"></i> UNDUH GAMBAR PANJANG</a>
                <button type="button" id="resetBtn" class="reset-btn" onclick="window.handlePdfToLongImageReset && window.handlePdfToLongImageReset()"><i class="fas fa-redo"></i> PROSES PDF LAIN</button>
            </div>
        </main>
    </div>

    <!-- Load scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="../js/shared/security.js"></script>
    <script src="../js/shared/toast.js"></script>
    <script src="../js/shared/pwa.js"></script>
    <script src="../js/shared/canvas-animation.js"></script>
    <script src="../js/shared/navbar.js"></script>
    <script src="../js/tools/pdf-to-long-image.js"></script>
</body>
</html>
